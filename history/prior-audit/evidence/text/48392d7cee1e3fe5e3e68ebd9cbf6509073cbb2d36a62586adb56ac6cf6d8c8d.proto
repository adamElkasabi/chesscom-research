// source: chesscom/coaches/v2/model.proto
// syntax: proto3

package chesscom.coaches.v2;

enum CoachVoiceSpeed {
  COACH_VOICE_SPEED_UNSPECIFIED = 0;
  COACH_VOICE_SPEED_NORMAL = 1;
  COACH_VOICE_SPEED_1_25_TIMES = 2;
  COACH_VOICE_SPEED_1_50_TIMES = 3;
  COACH_VOICE_SPEED_2_TIMES = 4;
}

enum CoachContext {
  COACH_CONTEXT_UNSPECIFIED = 0;
  COACH_CONTEXT_HOME = 1;
  COACH_CONTEXT_LEARN = 2;
}

enum CoachSpeechType {
  COACH_SPEECH_TYPE_UNSPECIFIED = 0;
  COACH_SPEECH_TYPE_WELCOME = 1;
  COACH_SPEECH_TYPE_MOTIVATIONAL = 2;
}

enum FinishVsCoachSource {
  FINISH_VS_COACH_SOURCE_UNSPECIFIED = 0;
  FINISH_VS_COACH_SOURCE_GAME = 1;
  FINISH_VS_COACH_SOURCE_ANALYSIS = 2;
  FINISH_VS_COACH_SOURCE_GAME_REVIEW = 3;
}

message Coach {
  oneof _voice_id {
  string voice_id = 5;
  }
  oneof _rive_animation_url {
  string rive_animation_url = 15;
  }
  oneof _greeting_rive_animation_url {
  string greeting_rive_animation_url = 16;
  }
  oneof _has_visemes {
  bool has_visemes = 17;
  }
  optional string id = 1;
  optional string name = 2;
  optional string titled_name = 3;
  optional string image_url = 4;
  optional string description = 6;
  optional .chesscom.api.v1.Country country = 7;
  optional string locale = 8;
  optional string text_id = 9;
  optional string analytics_id = 10;
  optional string icon_url = 11;
  repeated .chesscom.api.v1.Speech taglines = 12;
  optional .chesscom.coaches.v2.CoachI18nMetadata i18n_meta = 13;
  optional bool is_celebrity = 14;
}

message CoachI18nMetadata {
  oneof _language_indicator {
  string language_indicator = 1;
  }
}

message CoachCategory {
  optional string id = 1;
  optional string name = 2;
  repeated .chesscom.coaches.v2.Coach coaches = 3;
}

message SpeechString {
  optional string text = 1;
  optional string audio_hash = 2;
}

message PlayCoachAssistanceSettingsSnapshot {
  optional bool suggestion_arrows = 1;
  optional bool threat_arrows = 2;
  optional bool evaluation_bar = 3;
  optional bool move_feedback = 4;
  optional bool auto_hints = 5;
}

message FinishVsCoachContext {
  optional .chesscom.coaches.v2.FinishVsCoachSource source = 1;
  optional string original_game_id = 2;
  optional string original_game_type = 3;
}
