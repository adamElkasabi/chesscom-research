  USER_ID = 1;
  USERNAME = 2;
  TYPE = 3;
  CREATED_AT = 4;
  UPDATED_AT = 5;
  TIMEZONE = 6;
  CHESS_TITLE = 7;
  FLAIR_CODE = 8;
