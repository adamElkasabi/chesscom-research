// source: chesscom/explanation_engine/v1/feature_bot_config_resources.proto
// syntax: proto3

package chesscom.explanation_engine.v1;

message BotConfigResourcesRequest {
  oneof _proto_config {
  .chesscom.explanation_engine.v1.BotMoveConfiguration proto_config = 3;
  }
  optional string bot_config = 1;
  optional string artifact_id = 2;
}

message BookResource {
  optional string key = 1;
  optional int32 move_count = 2;
}

message NnResource {
  optional string key = 1;
}

message BotConfigResourcesResponse {
  oneof _book {
  .chesscom.explanation_engine.v1.BookResource book = 1;
  }
  oneof _nn {
  .chesscom.explanation_engine.v1.NnResource nn = 2;
  }
}
