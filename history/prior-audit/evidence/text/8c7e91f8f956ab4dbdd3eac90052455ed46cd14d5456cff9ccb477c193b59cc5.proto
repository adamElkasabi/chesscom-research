  .chesscom.train.v1.TrainBlunderChallenge blunder = 2;
  .chesscom.train.v1.TrainOpeningMistakeChallenge opening_mistake = 3;
  .chesscom.train.v1.TrainStrategyMistakeChallenge strategy_mistake = 4;
